<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar">
    <header class="header">
      <div class="header-left">
        <img src="../icons/icon-32.png" alt="" class="header-icon">
        <h1>Mocker</h1>
      </div>
      <div class="header-tabs">
        <button id="tab-capture" class="tab-btn active">Capture</button>
        <button id="tab-history" class="tab-btn">History</button>
      </div>
      <div class="header-right">
        <button id="reload-extension" class="header-btn" title="Reload extension">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <button id="open-options" class="header-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="toast" class="toast" hidden></div>

    <div class="content">

      <!-- ── Version Tree Section (persistent when snapshot exists) ── -->
      <div id="version-tree-section" hidden>
        <div class="version-tree-header">
          <div class="version-tree-info">
            <div class="snapshot-title" id="snapshot-title"></div>
            <div class="snapshot-meta" id="snapshot-meta"></div>
          </div>
          <div class="version-tree-actions">
            <button id="download-snapshot" class="btn-icon" title="Download" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="copy-preview" class="btn-icon" title="Preview" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="save-to-repo-btn" class="btn-icon" title="Save to repo" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            </button>
            <button id="new-capture-btn" class="btn-icon" title="New capture">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>
        <!-- Repo result (shown if committed) -->
        <div id="repo-result" class="repo-result" hidden>
          <div class="result-label">Repo</div>
          <a id="result-url" class="result-url" target="_blank"></a>
        </div>
        <div class="version-tree-body">
          <div id="version-tree" class="version-tree"></div>
        </div>
      </div>

      <!-- ── Phase: No Config ───────────────────────────────────── -->
      <div id="no-config" class="phase" hidden>
        <div class="card">
          <p class="card-text">Settings not configured.</p>
          <button id="open-options-card" class="btn btn-secondary btn-block">Open Settings</button>
        </div>
      </div>

      <!-- ── Phase: No Tab ──────────────────────────────────────── -->
      <div id="no-tab" class="phase" hidden>
        <div class="card">
          <p class="card-text">Navigate to a web page to capture a snapshot.</p>
        </div>
      </div>

      <!-- ── Phase: Capture Form ────────────────────────────────── -->
      <div id="capture-form" class="phase" hidden>
        <div class="card">
          <div class="current-url" id="current-url" title=""></div>

          <div class="field">
            <label for="snapshot-name">Snapshot Name</label>
            <input type="text" id="snapshot-name" placeholder="e.g. dashboard">
            <span class="hint">Used as the snapshot identifier</span>
          </div>

          <!-- Collapsible repo options -->
          <div id="repo-options" class="repo-options" hidden>
            <div class="field field-checkbox">
              <label class="checkbox-label">
                <input type="checkbox" id="save-to-repo-check">
                Also save to Git repository
              </label>
            </div>
            <div id="branch-fields" class="branch-fields" hidden>
              <div class="field">
                <label>Branch</label>
                <div class="branch-toggle">
                  <button type="button" class="toggle-btn active" data-mode="new">New branch</button>
                  <button type="button" class="toggle-btn" data-mode="existing">Existing branch</button>
                </div>
                <input type="text" id="branch-name" placeholder="">
                <span class="hint" id="branch-hint">A new branch will be created from the base branch</span>
              </div>
            </div>
          </div>

          <button id="save-btn" class="btn btn-primary btn-block">Capture Snapshot</button>
        </div>
      </div>

      <!-- ── Phase: Progress ────────────────────────────────────── -->
      <div id="progress" class="phase" hidden>
        <div class="card">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-text" id="progress-text">Starting...</div>
        </div>
      </div>

      <!-- ── Phase: Remix Prompt ────────────────────────────────── -->
      <div id="phase-prompt" class="phase remix-card" hidden>
        <div class="card">
          <div class="remix-source" id="remix-source">
            <span class="remix-source-label">Remixing from: <strong id="remix-source-name">Original</strong></span>
            <button id="clear-remix-source" class="remix-source-clear" hidden>x</button>
          </div>

          <div id="remix-composer-section">
            <div class="field">
              <label for="remix-prompt">Describe changes</label>
              <div class="remix-composer" id="remix-composer">
                <div id="remix-refs-thumbs" class="remix-composer-thumbs" hidden></div>
                <div id="focus-area-chips" class="focus-area-chips" hidden></div>
                <textarea id="remix-prompt" rows="3" placeholder="e.g. Make it dark mode with a purple accent..."></textarea>
                <div class="remix-composer-toolbar">
                  <button type="button" id="remix-focus-picker" class="remix-composer-attach" title="Select focus areas on page">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
                  </button>
                  <span id="remix-focus-count" class="remix-composer-count" hidden></span>
                  <button type="button" id="remix-add-refs" class="remix-composer-attach" title="Add reference images (max 10, 5MB each)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  </button>
                  <span id="remix-refs-count" class="remix-composer-count" hidden></span>
                </div>
                <input type="file" id="remix-refs-input" accept="image/*" multiple hidden>
              </div>
            </div>

            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;">
              <label class="remix-bento-toggle" for="remix-use-bento">
                <span class="toggle-switch">
                  <input type="checkbox" id="remix-use-bento" checked>
                  <span class="toggle-track"></span>
                </span>
                <span>Use Bento</span>
              </label>

              <label class="remix-bento-toggle" for="remix-plan-first">
                <span class="toggle-switch">
                  <input type="checkbox" id="remix-plan-first">
                  <span class="toggle-track"></span>
                </span>
                <span>Plan first</span>
              </label>
            </div>

            <div class="remix-options">
              <div class="field field-inline">
                <label for="remix-count">Variations</label>
                <select id="remix-count">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <button type="button" id="remix-btn" class="btn btn-primary">Remix</button>
            </div>
          </div>

          <!-- Drop overlay shown while dragging files over the card -->
          <div id="remix-drop-overlay" class="remix-drop-overlay" hidden>
            <div class="remix-drop-overlay-inner">Drop images to attach</div>
          </div>
        </div>
      </div>

      <!-- ── Phase: Plan Review ─────────────────────────────────── -->
      <div id="phase-plan" class="phase" hidden>
        <section id="plan-panel" class="plan-panel">
          <div class="plan-panel-header">
            <strong>Plan</strong>
            <span class="plan-panel-hint">Review and edit before remix runs</span>
          </div>
          <label class="plan-panel-label" for="plan-bullets">What the agent will change</label>
          <textarea id="plan-bullets" class="plan-bullets" rows="6" placeholder="- bullet one&#10;- bullet two"></textarea>
          <div id="plan-questions" class="plan-questions"></div>
          <div class="plan-panel-actions">
            <button type="button" id="plan-confirm-btn" class="btn btn-primary">Start remix</button>
            <button type="button" id="plan-skip-btn" class="btn btn-secondary">Skip plan</button>
            <button type="button" id="plan-cancel-btn" class="btn btn-ghost">Cancel</button>
          </div>
        </section>
      </div>

      <!-- ── Phase: Remix Progress ──────────────────────────────── -->
      <div id="phase-remix-progress" class="phase" hidden>
        <div class="card">
          <div id="remix-status" class="remix-status"></div>
          <div id="remix-turns" class="remix-turns" hidden></div>
        </div>
      </div>

      <!-- ── Phase: Error ───────────────────────────────────────── -->
      <div id="error" class="phase" hidden>
        <div class="card">
          <div class="error-text" id="error-text"></div>
          <button id="retry-btn" class="btn btn-primary btn-block">Try Again</button>
        </div>
      </div>

      <!-- ── History Section ────────────────────────────────────── -->
      <div id="history" class="section" hidden>
        <div id="history-list"></div>
        <div id="history-empty" class="history-empty" hidden>No snapshots yet</div>
      </div>

    </div>

    <!-- Lightbox for previewing reference images -->
    <div id="image-lightbox" class="image-lightbox" hidden>
      <button id="image-lightbox-close" class="image-lightbox-close" aria-label="Close">&times;</button>
      <img id="image-lightbox-img" alt="">
      <div id="image-lightbox-caption" class="image-lightbox-caption"></div>
    </div>
  </div>
  <script src="sidebar.js" type="module"></script>
</body>
</html>
